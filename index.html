<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Author, Researcher, Artist">
  <title>WriterJoshua</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>📚</text></svg>">
  <link rel="stylesheet" href="./assets/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
</head>
<body>
  <!-- STATIC HEADER -->
  <header>
    <a href="?page=home" class="header-link">
      <img src="./assets/media/writerjoshua.jpg" alt="WriterJoshua" class="profile-pic">
    </a>
    <div class="header-text">
      <h1>WriterJoshua</h1>
      <p>Author, Researcher, Artist</p>
    </div>
    <div class="header-user">
      <button id="authBtn" onclick="openAuthModal()" class="user-btn">Sign In</button>
      <div id="userMenu" style="display:none;" class="user-menu">
        <div id="userInfo" class="user-info"></div>
        <button onclick="openProfileModal()" class="user-btn">Edit Profile</button>
        <button id="adminBtn" onclick="openAdminPanel()" class="user-btn" style="display:none; background: #ff6b00;">Admin</button>
      </div>
    </div>
  </header>

  <!-- STATIC NAVIGATION -->
  <nav>
    <a href="?page=home" class="nav-link">Home</a>
    <a href="?page=about-josh" class="nav-link">About Josh</a>
    <a href="?page=jots" class="nav-link">Jots</a>
    <a href="?page=archive" class="nav-link">Blog</a>
    <a href="?page=projects" class="nav-link">Projects</a>
    <a href="?page=contact" class="nav-link">Contact</a>
  </nav>

  <!-- DYNAMIC CONTENT AREA -->
  <main id="content"></main>

  <!-- AUTH MODALS -->
  <div id="authModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="modal-close" onclick="closeAuthModal()">&times;</span>
      
      <!-- Sign In Tab -->
      <div id="signInTab" class="auth-tab">
        <h2>Sign In</h2>
        <input type="email" id="signInEmail" placeholder="Email" class="auth-input">
        <input type="password" id="signInPassword" placeholder="Password" class="auth-input">
        <button onclick="signIn()" class="auth-btn">Sign In</button>
        <p class="auth-toggle">New user? <a onclick="switchToSignUp()">Sign up</a></p>
        <div id="signInError" class="auth-error"></div>
      </div>
      
      <!-- Sign Up Tab -->
      <div id="signUpTab" class="auth-tab" style="display:none;">
        <h2>Sign Up</h2>
        <input type="email" id="signUpEmail" placeholder="Email" class="auth-input">
        <input type="password" id="signUpPassword" placeholder="Password" class="auth-input">
        <input type="text" id="username" placeholder="Username" class="auth-input">
        <button onclick="signUp()" class="auth-btn">Sign Up</button>
        <p class="auth-toggle">Already have an account? <a onclick="switchToSignIn()">Sign in</a></p>
        <div id="signUpError" class="auth-error"></div>
      </div>
    </div>
  </div>

  <!-- PROFILE MODAL -->
  <div id="profileModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="modal-close" onclick="closeProfileModal()">&times;</span>
      <h2>Edit Profile</h2>
      <input type="text" id="editUsername" placeholder="Username" class="auth-input">
      <div class="emoji-picker-container">
        <label>Avatar Style:</label>
        <select id="avatarStyle" class="auth-input">
          <option value="retro">Retro 8-bit</option>
          <option value="identicon">Geometric Pattern</option>
          <option value="monsterid">Monster</option>
          <option value="wavatar">Face</option>
          <option value="robohash">Robot</option>
          <option value="blank">Blank</option>
        </select>
      </div>
      <textarea id="editBio" placeholder="Bio (200 characters max)" class="auth-input" maxlength="200"></textarea>
      <button onclick="updateProfile()" class="auth-btn">Save Profile</button>
      <button onclick="signOutUser()" class="auth-btn auth-btn-danger">Sign Out</button>
      <div id="profileError" class="auth-error"></div>
    </div>
  </div>

  <!-- ADMIN PANEL MODAL -->
  <div id="adminModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="modal-close" onclick="closeAdminModal()">&times;</span>
      <h2>Admin Panel</h2>
      <div id="adminTabs" class="admin-tabs">
        <button class="admin-tab-btn active" onclick="switchAdminTab('users')">Users</button>
        <button class="admin-tab-btn" onclick="switchAdminTab('comments')">Comments</button>
      </div>
      
      <div id="usersTab" class="admin-tab-content">
        <h3>User Management</h3>
        <div id="usersList" class="users-list"></div>
      </div>
      
      <div id="commentsTab" class="admin-tab-content" style="display:none;">
        <h3>Moderate Comments</h3>
        <div id="commentsList" class="comments-moderation"></div>
      </div>
    </div>
  </div>

  <!-- STATIC FOOTER -->
  <footer>
    <img src="./assets/media/writerjoshua-banner.jpg" alt="WriterJoshua Banner" class="footer-banner" onerror="this.style.display='none';">
    <div class="footer-controls">
      <button class="share-btn" onclick="shareCurrentPage()">Share</button>
    </div>
    <p class="footer-copyright">&copy; 2026 Joshua Lucero</p>
  </footer>

<script>
  // ===== MARKDOWN-IT INITIALIZATION =====
  const md = window.markdownit ? window.markdownit({ 
    html: true,
    breaks: true 
  }) : null;

  // ===== GLOBAL PAGE METADATA =====
  let currentPageMetadata = {
    title: 'WriterJoshua',
    description: 'Author, Researcher, Artist'
  };
  window.currentPageMetadata = currentPageMetadata;

  // ===== CACHE HELPERS =====
  function getCachedHTML(key) {
    try {
      const cached = sessionStorage.getItem(key);
      if (!cached) return null;
      
      const data = JSON.parse(cached);
      return data.html || null;
    } catch (e) {
      console.warn('Cache read failed:', e);
      return null;
    }
  }

  function setCachedHTML(key, html, expiryHours = 24) {
    try {
      const data = {
        html: html,
        timestamp: Date.now(),
        expiryHours: expiryHours
      };
      sessionStorage.setItem(key, JSON.stringify(data));
    } catch (e) {
      console.warn('Cache write failed:', e);
    }
  }

  function isCacheExpired(key) {
    try {
      const cached = sessionStorage.getItem(key);
      if (!cached) return true;
      
      const data = JSON.parse(cached);
      const ageHours = (Date.now() - data.timestamp) / (1000 * 60 * 60);
      const expiryHours = data.expiryHours || 24;
      
      return ageHours > expiryHours;
    } catch (e) {
      return true;
    }
  }

  function clearCache(keys) {
    keys.forEach(key => {
      try {
        sessionStorage.removeItem(key);
        sessionStorage.removeItem(`meta_${key.replace('cache_', '')}`);
      } catch (e) {
        console.warn('Cache clear failed:', e);
      }
    });
  }

  function detectPageRefresh() {
    // Check if this is a refresh (not back/forward)
    const isRefresh = performance.navigation.type === 1 || 
                      (window.performance && window.performance.getEntriesByType('navigation')[0]?.type === 'reload');
    
    if (isRefresh) {
      // Clear time-sensitive caches on refresh
      clearCache(['cache_jots', 'cache_archive', 'cache_projects']);
    }
  }

  // ===== UTILITIES =====
  function getPageParam() {
    const params = new URLSearchParams(window.location.search);
    return params.get('page') || 'home';
  }

  function highlightActiveNav() {
    const currentPage = getPageParam();
    document.querySelectorAll('.nav-link').forEach(link => {
      const page = new URLSearchParams(link.search).get('page');
      if (page === currentPage) {
        link.classList.add('active');
      } else {
        link.classList.remove('active');
      }
    });
  }

  function showError(message = 'Unable to load content. Please try again.') {
    document.getElementById('content').innerHTML = `<div class="error"><p>${escapeHtml(message)}</p></div>`;
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function formatDateTime(dateStr, timeStr) {
    try {
      const [year, month, day] = dateStr.split('-');
      const [hours, minutes] = timeStr.split(':');
      
      const date = new Date(year, month - 1, day, hours, minutes);
      const monthName = date.toLocaleString('default', { month: 'long' });
      const dayNum = date.getDate();
      const yearNum = date.getFullYear();
      
      const timeObj = new Date(2000, 0, 1, hours, minutes);
      const timeFormatted = timeObj.toLocaleString('en-US', {
        hour: 'numeric',
        minute: '2-digit',
        hour12: true,
        timeZone: 'America/Los_Angeles'
      });
      
      return `${monthName} ${dayNum}, ${yearNum} at ${timeFormatted} PST`;
    } catch (e) {
      return `${dateStr} at ${timeStr}`;
    }
  }

  function getImagePath(imagePath) {
    if (!imagePath) return '';
    if (!imagePath.startsWith('./') && !imagePath.startsWith('http')) {
      return './' + imagePath;
    }
    return imagePath;
  }

  function unescapeNewlines(text) {
    if (!text) return '';
    const unescaped = text.replace(/\\n/g, '\n');
    console.log('Original:', text.substring(0, 100));
    console.log('Unescaped:', unescaped.substring(0, 100));
    return unescaped;
  }

  // ===== FRONTMATTER PARSER =====
  function parseFrontmatter(markdown) {
    const frontmatterRegex = /^---\n([\s\S]*?)\n---\n([\s\S]*)$/;
    const match = markdown.match(frontmatterRegex);
    
    if (!match) {
      return { metadata: {}, content: markdown };
    }
    
    const frontmatterText = match[1];
    const content = match[2];
    const metadata = {};
    
    frontmatterText.split('\n').forEach(line => {
      const [key, ...valueParts] = line.split(':');
      if (key && valueParts.length) {
        const value = valueParts.join(':').trim().replace(/^["']|["']$/g, '');
        metadata[key.trim()] = value;
      }
    });
    
    return { metadata, content };
  }

  // ===== META TAG INJECTION =====
  function injectMetaTags(metadata) {
    const head = document.head;
    
    if (metadata.title) {
      document.title = `${metadata.title} | WriterJoshua`;
    }
    
    document.querySelectorAll('meta[data-dynamic="true"]').forEach(tag => tag.remove());
    
    const metaFields = {
      'description': 'description',
      'excerpt': 'description',
      'keywords': 'keywords',
      'image': 'og:image',
      'twitter-title': 'twitter:title',
      'twitter-description': 'twitter:description'
    };
    
    Object.entries(metaFields).forEach(([sourceKey, metaName]) => {
      if (metadata[sourceKey]) {
        const meta = document.createElement('meta');
        meta.setAttribute('data-dynamic', 'true');
        
        if (metaName.startsWith('og:')) {
          meta.setAttribute('property', metaName);
        } else {
          meta.setAttribute('name', metaName);
        }
        
        meta.setAttribute('content', metadata[sourceKey]);
        head.appendChild(meta);
      }
    });
  }

  // ===== MARKDOWN LOADER =====
  function loadMarkdown(page) {
    if (!md) {
      showError('Markdown processor unavailable. Please refresh the page.');
      return;
    }

    const cacheKey = `cache_${page}`;
    const cachedHTML = getCachedHTML(cacheKey);
    const metadataKey = `meta_${page}`;
    const cachedMetadata = getCachedHTML(metadataKey);
    
    if (cachedHTML) {
      console.log('Loading from cache:', cacheKey);
      document.getElementById('content').innerHTML = cachedHTML;
      
      // Restore cached metadata
      if (cachedMetadata) {
        window.currentPageMetadata = JSON.parse(cachedMetadata);
        console.log('Restored cached metadata:', window.currentPageMetadata);
      }
      
      highlightActiveNav();
      return;
    }

    const currentYear = new Date().getFullYear();
    const paths = [`./assets/pages/${page}.md`, `./${page}.md`];
    
    for (let i = 0; i <= 10; i++) {
      const year = currentYear - i;
      paths.push(`./blog/${year}/${page}.md`);
    }

    function tryPaths(pathIndex) {
      if (pathIndex >= paths.length) {
        showError(`Page not found: ${page}`);
        return;
      }

      const currentPath = paths[pathIndex];
      
      fetch(currentPath)
        .then(response => {
          if (!response.ok) throw new Error('Not found');
          return response.text();
        })
        .then(markdown => {
          const { metadata, content } = parseFrontmatter(markdown);
          console.log('Parsed frontmatter:', metadata);
          console.log('Page:', page);
          
          injectMetaTags(metadata);
          
          // Store metadata for sharing
          currentPageMetadata = {
            title: metadata.title || page,
            description: metadata.excerpt || metadata.description || ''
          };
          window.currentPageMetadata = currentPageMetadata;
          console.log('Updated window.currentPageMetadata:', window.currentPageMetadata);
          
          let html = '';
          
          if (metadata.title) {
            html += `<h1>${escapeHtml(metadata.title)}</h1>`;
          }
          
          if (metadata.date && metadata.time) {
            const formattedDateTime = formatDateTime(metadata.date, metadata.time);
            html += `<p class="post-meta">${formattedDateTime}</p>`;
          }
          
          if (metadata.image) {
            html += `<img src="${getImagePath(metadata.image)}" alt="${escapeHtml(metadata.title || 'Post image')}" class="post-image">`;
          }
          
          if (metadata.excerpt) {
            html += `<p class="post-excerpt"><em>${escapeHtml(metadata.excerpt)}</em></p>`;
          }
          
          html += md.render(content);
          
          // Add likes and comments for blog posts
          html += renderLikesAndComments(page, 'blog-posts');
          
          document.getElementById('content').innerHTML = html;
          setCachedHTML(cacheKey, html, 24);
          
          // Load likes/comments after rendering
          updateLikeDisplay(page, 'blog-posts');
          loadComments(page, 'blog-posts');
          
          // Cache metadata separately
          const metadataKey = `meta_${page}`;
          setCachedHTML(metadataKey, JSON.stringify(window.currentPageMetadata), 24);
          
          highlightActiveNav();
        })
        .catch(() => {
          tryPaths(pathIndex + 1);
        });
    }

    tryPaths(0);
  }

  // ===== GENERIC JSON LOADER & RENDERER =====
  function loadJSON(filename, itemsKey) {
    const cacheKey = `cache_${filename}`;
    
    // Determine cache expiry based on file type
    let expiryHours = 24; // default
    if (itemsKey === 'jots') {
      expiryHours = 24; // refresh daily
    } else if (itemsKey === 'archive' || itemsKey === 'projects') {
      expiryHours = 720; // refresh monthly (30 days)
    }
    
    const cachedHTML = getCachedHTML(cacheKey);
    const cacheExpired = isCacheExpired(cacheKey);
    
    if (cachedHTML && !cacheExpired) {
      document.getElementById('content').innerHTML = cachedHTML;
      highlightActiveNav();
      return;
    }
    
    fetch(`./assets/pages/${filename}.json`)
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      })
      .then(data => renderJSON(data, itemsKey, cacheKey, expiryHours))
      .catch(err => {
        console.error(`${filename} load failed:`, err);
        showError(`Error loading ${filename}.`);
      });
  }

  function renderJSON(data, itemsKey, cacheKey, expiryHours = 24) {
    let html = '';
    let pageTitle = '';
    let pageDescription = '';

    try {
      if (data.intro) {
        html += md.render(data.intro);
      }
      if (data.introImage) {
        html += `<img src="${getImagePath(data.introImage)}" alt="Intro" class="projects-image">`;
      }

    if (itemsKey === 'projects') {
      pageTitle = 'Projects';
      pageDescription = data.intro || 'My projects';
      html = '<h1>Projects</h1>' + html;
      html += '<div class="projects-grid">';
      
      const projects = (data.projects || []).sort((a, b) => {
        if (a.order !== undefined && b.order !== undefined) {
          return a.order - b.order;
        }
        return 0;
      });
      
      projects.forEach(project => {
        html += `
          <div class="project-card">
            <a href="?page=${encodeURIComponent(project.slug)}">
              <img src="${getImagePath(project.image)}" alt="${escapeHtml(project.title)}" class="project-image">
              <h2>${escapeHtml(project.title)}</h2>
            </a>
            <div class="project-excerpt">${escapeHtml(project.excerpt)}</div>
          </div>
        `;
      });
      html += '</div>';
    } else if (itemsKey === 'jots') {
      pageTitle = 'Jots';
      pageDescription = data.intro || 'My jots and thoughts';
      html = '<h1>Jots</h1>' + html;
      
      const sorted = (data.jots || []).sort((a, b) =>
        new Date(b.date + ' ' + b.time) - new Date(a.date + ' ' + a.time)
      );
      
      sorted.forEach(jot => {
        const jotId = jot.id || jot.title;
        html += `
          <div class="jot">
            <h2>${escapeHtml(jot.title)}</h2>
            <p class="jot-meta">${formatDateTime(jot.date, jot.time)}</p>
            ${md.render(jot.content)}
            ${jot.image ? `<img src="${getImagePath(jot.image)}" alt="${escapeHtml(jot.title)}" class="jot-image">` : ''}
            ${renderLikesAndComments(jotId, 'jots')}
          </div>
        `;
      });
    } else if (itemsKey === 'archive') {
      pageTitle = 'Archive';
      pageDescription = data.intro || 'Blog archive';
      html = '<h1>Archive</h1>' + html;
      
      const sortedYears = (data.years || []).sort((a, b) => {
        if (a.year !== b.year) return b.year - a.year;
        return b.month - a.month;
      });
      
      sortedYears.forEach(yearMonth => {
        const monthName = new Date(yearMonth.year, yearMonth.month - 1).toLocaleString('default', { month: 'long' });
        html += `<h2>${monthName} ${yearMonth.year}</h2><ul>`;
        
        const sortedPosts = (yearMonth.posts || []).sort((a, b) =>
          new Date(b.date) - new Date(a.date)
        );
        
        sortedPosts.forEach(post => {
          const slug = post.slug.replace(/^\/+/, '');
          html += `
            <li>
              <a href="?page=${encodeURIComponent(slug)}">${escapeHtml(post.title)}</a> — ${escapeHtml(post.date)}
              <p class="post-excerpt">${escapeHtml(post.excerpt)}</p>
            </li>
          `;
        });

        html += '</ul>';
      });
    }

    if (data.outro) {
      html += md.render(data.outro);
    }
    if (data.outroImage) {
      html += `<img src="${getImagePath(data.outroImage)}" alt="Outro" class="projects-image">`;
    }

    document.getElementById('content').innerHTML = html;
    
    // Store metadata for sharing
    currentPageMetadata = {
      title: pageTitle,
      description: pageDescription
    };
    window.currentPageMetadata = currentPageMetadata;
    
    if (cacheKey) {
      setCachedHTML(cacheKey, html, expiryHours);
    }
    
    highlightActiveNav();
    } catch (err) {
      console.error('renderJSON error:', err);
      showError('Error rendering page');
    }
  }

  // ===== MD5 HASH FOR GRAVATAR =====
  function md5(str) {
    // Proper MD5 implementation for Gravatar
    let x = [], s = str.toLowerCase().trim(), i = 0;
    while (i < s.length) x[i >> 2] |= s.charCodeAt(i) << ((i++ & 3) << 3);
    x[s.length >> 2] |= 0x80 << (((s.length) & 3) << 3);
    x[(((s.length + 8) >> 6) << 4) + 14] = s.length << 3;
    
    for (i = 1, s = 0; i < x.length; i += 16) {
      let a = x[i - 1], b = -271733879, c = -1732584194, d = 271733878;
      for (let j = 0; j < 64; j++) {
        let f, g;
        if (j < 16) f = (b & c) | (~b & d), g = j;
        else if (j < 32) f = (d & b) | (~d & c), g = 5 * j + 1;
        else if (j < 48) f = b ^ c ^ d, g = 3 * j + 5;
        else f = c ^ (b | ~d), g = 7 * j;
        let t = d;
        d = c;
        c = b;
        b = b + ((a << 5 | a >> 27) + f + 0x67452301 + [0,0,0,0,271733879,1732584193,0,0,1732584194,0,0,0,271733878,0,0,0][g >> 4] + x[i + (g & 15)]) | 0;
        a = t;
      }
      x[i - 1] = a + x[i - 1] | 0;
    }
    return [x[1], x[2], x[3], x[4]].map(x => ((x >> 24) & 255).toString(16).padStart(2, '0') + ((x >> 16) & 255).toString(16).padStart(2, '0') + ((x >> 8) & 255).toString(16).padStart(2, '0') + (x & 255).toString(16).padStart(2, '0')).join('');
  }

  // ===== ADMIN FUNCTIONS =====
  function openAdminPanel() {
    if (!currentUser || !isAdmin(currentUser.email)) return;
    document.getElementById('adminModal').style.display = 'flex';
    loadAllUsers();
    loadAllComments();
  }

  function closeAdminModal() {
    document.getElementById('adminModal').style.display = 'none';
  }

  function switchAdminTab(tab) {
    document.querySelectorAll('.admin-tab-content').forEach(t => t.style.display = 'none');
    document.querySelectorAll('.admin-tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tab + 'Tab').style.display = 'block';
    event.target.classList.add('active');
  }

  function loadAllUsers() {
    const { ref, onValue } = window.firebase;
    onValue(ref(window.firebase.database, 'users'), (snapshot) => {
      const users = snapshot.val() || {};
      const usersList = document.getElementById('usersList');
      usersList.innerHTML = '';
      
      Object.entries(users).forEach(([uid, user]) => {
        const userEl = document.createElement('div');
        userEl.className = 'user-item';
        userEl.innerHTML = `
          <div class="user-item-header">
            <span>${user.avatar ? `<img src="${user.avatar}" class="user-avatar-thumb">` : '👤'}</span>
            <span class="user-item-name">${escapeHtml(user.username)}</span>
            <span class="user-item-role">${user.role || 'User'}</span>
          </div>
          <p class="user-item-email">${user.email}</p>
          <div class="user-item-actions">
            <button onclick="changeUserRole('${uid}', 'Admin')" class="admin-action-btn">Make Admin</button>
            <button onclick="changeUserRole('${uid}', 'User')" class="admin-action-btn">Make User</button>
            <button onclick="deactivateUser('${uid}')" class="admin-action-btn danger">Deactivate</button>
          </div>
        `;
        usersList.appendChild(userEl);
      });
    });
  }

  function loadAllComments() {
    const { ref, onValue } = window.firebase;
    const commentsList = document.getElementById('commentsList');
    commentsList.innerHTML = '';
    
    // Load comments from both jots and blog posts
    ['jots', 'blog-posts'].forEach(type => {
      onValue(ref(window.firebase.database, type), (snapshot) => {
        const items = snapshot.val() || {};
        Object.entries(items).forEach(([itemId, item]) => {
          const comments = item.comments || {};
          Object.entries(comments).forEach(([commentId, comment]) => {
            const commentEl = document.createElement('div');
            commentEl.className = 'comment-item';
            commentEl.innerHTML = `
              <div class="comment-item-header">
                <span class="comment-item-user">${escapeHtml(comment.username)}</span>
                <span class="comment-item-type">${type}</span>
                <span class="comment-item-date">${new Date(comment.timestamp).toLocaleDateString()}</span>
              </div>
              <p class="comment-item-text">${escapeHtml(comment.text)}</p>
              <div class="comment-item-actions">
                <button onclick="flagComment('${type}', '${itemId}', '${commentId}')" class="admin-action-btn">Flag</button>
                <button onclick="deleteComment('${type}', '${itemId}', '${commentId}')" class="admin-action-btn danger">Delete</button>
              </div>
            `;

  // ===== AUTH FUNCTIONS =====
  function signIn() {
    const email = document.getElementById('signInEmail').value;
    const password = document.getElementById('signInPassword').value;
    const errorDiv = document.getElementById('signInError');

    if (!email || !password) {
      errorDiv.textContent = 'Please enter email and password';
      return;
    }

    window.firebase.auth.signInWithEmailAndPassword(email, password)
      .then(userCredential => {
        currentUser = userCredential.user;
        loadUserProfile(currentUser.uid);
        closeAuthModal();
        updateUserUI();
      })
      .catch(error => {
        errorDiv.textContent = error.message;
      });
  }

  function signUp() {
    const email = document.getElementById('signUpEmail').value;
    const password = document.getElementById('signUpPassword').value;
    const username = document.getElementById('username').value.trim();
    const errorDiv = document.getElementById('signUpError');

    if (!email || !password || !username) {
      errorDiv.textContent = 'Please fill in all fields';
      return;
    }

    window.firebase.auth.createUserWithEmailAndPassword(email, password)
      .then(userCredential => {
        currentUser = userCredential.user;
        const role = isAdmin(email) ? 'Admin' : 'User';
        const gravatarUrl = `https://www.gravatar.com/avatar/${md5(email.toLowerCase())}?d=retro`;
        
        currentUserProfile = { 
          username, 
          avatar: gravatarUrl,
          avatar_style: 'retro',
          bio: '',
          email,
          role,
          created_at: Date.now()
        };
        
        saveUserProfile(currentUser.uid, currentUserProfile);
        closeAuthModal();
        updateUserUI();
      })
      .catch(error => {
        errorDiv.textContent = error.message;
      });
  }

  function signOutUser() {
    window.firebase.auth.signOut()
      .then(() => {
        currentUser = null;
        currentUserProfile = null;
        closeProfileModal();
        updateUserUI();

      .catch(error => {
        console.error('Sign out error:', error);
      });
  }

  function updateProfile() {
    if (!currentUser) return;
    
    const username = document.getElementById('editUsername').value || currentUserProfile.username;
    const avatarStyle = document.getElementById('avatarStyle').value;
    const bio = document.getElementById('editBio').value;
    const gravatarUrl = `https://www.gravatar.com/avatar/${md5(currentUser.email.toLowerCase())}?d=${avatarStyle}`;

    currentUserProfile = { 
      ...currentUserProfile, 
      username, 
      avatar_style: avatarStyle,
      avatar: gravatarUrl,
      bio 
    };
    
    saveUserProfile(currentUser.uid, currentUserProfile);
    closeProfileModal();
    updateUserUI();
  }

  function saveUserProfile(uid, profileData) {
    const { ref, set } = window.firebase;
    set(ref(window.firebase.database, `users/${uid}`), {
      email: profileData.email,
      username: profileData.username,
      avatar: profileData.avatar,
      bio: profileData.bio
    });
  }

  function loadUserProfile(uid) {
    const { ref, onValue } = window.firebase;
    onValue(ref(window.firebase.database, `users/${uid}`), (snapshot) => {
      if (snapshot.exists()) {
        currentUserProfile = snapshot.val();
      } else {
        currentUserProfile = {
          username: `User_${Math.random().toString(36).substring(7)}`,
          avatar: '😊',
          bio: ''
        };
      }
      updateUserUI();
    });
  }

  function updateUserUI() {
    const authBtn = document.getElementById('authBtn');
    const userMenu = document.getElementById('userMenu');
    const userInfo = document.getElementById('userInfo');
    const adminBtn = document.getElementById('adminBtn');

    if (currentUser && currentUserProfile) {
      authBtn.style.display = 'none';
      userMenu.style.display = 'flex';
      userInfo.innerHTML = `<div class="user-avatar">${currentUserProfile.avatar ? `<img src="${currentUserProfile.avatar}" style="width:32px; height:32px; border-radius: 50%;">` : '👤'}</div><div class="user-name">${currentUserProfile.username}</div>`;
      
      if (isAdmin(currentUser.email)) {
        adminBtn.style.display = 'block';
      } else {
        adminBtn.style.display = 'none';
      }
    } else {
      authBtn.style.display = 'block';
      userMenu.style.display = 'none';
    }
  }

  function addLike(contentId, contentType) {
    if (!currentUser) {
      openAuthModal();
      return;
    }

    const { ref, set, onValue } = window.firebase;
    const likePath = `${contentType}/${contentId}/likes/${currentUser.uid}`;
    
    set(ref(window.firebase.database, likePath), {
      username: currentUserProfile.username,
      avatar: currentUserProfile.avatar,
      timestamp: Date.now()
    });
    
    updateLikeDisplay(contentId, contentType);
  }

  function updateLikeDisplay(contentId, contentType) {
    const { ref, onValue } = window.firebase;
    const likesPath = `${contentType}/${contentId}/likes`;
    
    onValue(ref(window.firebase.database, likesPath), (snapshot) => {
      const likes = snapshot.val() || {};
      const count = Object.keys(likes).length;
      const likeBtn = document.getElementById(`like-btn-${contentId}`);
      const likeCntDisplay = document.getElementById(`like-count-${contentId}`);
      
      if (likeBtn) {
        likeBtn.textContent = likes[currentUser?.uid] ? '❤️ Unlike' : '🤍 Like';
      }
      if (likeCntDisplay) {
        likeCntDisplay.textContent = `${count} ${count === 1 ? 'like' : 'likes'}`;
      }
    });
  }

  function addComment(contentId, contentType) {
    if (!currentUser) {
      openAuthModal();
      return;
    }

    const commentText = document.getElementById(`comment-input-${contentId}`).value.trim();
    if (!commentText) return;

    const { ref, push } = window.firebase;
    const commentsPath = `${contentType}/${contentId}/comments`;
    
    push(ref(window.firebase.database, commentsPath), {
      userId: currentUser.uid,
      username: currentUserProfile.username,
      avatar: currentUserProfile.avatar,
      text: commentText,
      timestamp: Date.now()
    });

    document.getElementById(`comment-input-${contentId}`).value = '';
    loadComments(contentId, contentType);
  }

  function loadComments(contentId, contentType) {
    const { ref, onValue } = window.firebase;
    const commentsPath = `${contentType}/${contentId}/comments`;
    
    onValue(ref(window.firebase.database, commentsPath), (snapshot) => {
      const comments = snapshot.val() || {};
      const commentsContainer = document.getElementById(`comments-${contentId}`);
      
      if (!commentsContainer) return;
      
      commentsContainer.innerHTML = '';
      
      Object.values(comments).sort((a, b) => b.timestamp - a.timestamp).forEach(comment => {
        const commentEl = document.createElement('div');
        commentEl.className = 'comment';
        commentEl.innerHTML = `
          <div class="comment-header">
            <span class="comment-avatar">${comment.avatar}</span>
            <span class="comment-username">${escapeHtml(comment.username)}</span>
            <span class="comment-time">${new Date(comment.timestamp).toLocaleDateString()}</span>
          </div>
          <div class="comment-text">${escapeHtml(comment.text)}</div>
        `;
        commentsContainer.appendChild(commentEl);
      });
    });
  }

  // ===== ROUTE HANDLER =====
  function handleRoute() {
    const page = getPageParam();

    // Check if it's a profile page
    if (page.startsWith('profile_')) {
      const username = page.replace('profile_', '');
      loadPublicProfile(username);
      return;
    }

    if (page === 'jots') {
      loadJSON('jots', 'jots');
    } else if (page === 'archive') {
      loadJSON('archive', 'archive');
    } else if (page === 'projects') {
      loadJSON('projects', 'projects');
    } else {
      loadMarkdown(page);
    }

    highlightActiveNav();
    window.scrollTo(0, 0);
  }

  function loadPublicProfile(username) {
    const { ref, query, orderByChild, equalTo, onValue } = window.firebase;
    
    // Query for user by username
    onValue(ref(window.firebase.database, 'users'), (snapshot) => {
      const users = snapshot.val() || {};
      let foundUser = null;
      
      for (let uid in users) {
        if (users[uid].username === username) {
          foundUser = users[uid];
          break;
        }
      }
      
      if (foundUser) {
        const html = `
          <div class="public-profile">
            <div class="profile-header">
              <div class="profile-avatar" style="font-size: 4em;">${foundUser.avatar}</div>
              <h1>${escapeHtml(foundUser.username)}</h1>
              <p class="profile-bio">${escapeHtml(foundUser.bio)}</p>
            </div>
          </div>
        `;
        
        document.getElementById('content').innerHTML = html;
        highlightActiveNav();
      } else {
        showError(`User not found: ${username}`);
      }
    });
  }

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Author, Researcher, Artist">
  <title>WriterJoshua</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>📚</text></svg>">
  <link rel="stylesheet" href="./assets/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
</head>
<body>
  <!-- STATIC HEADER -->
  <header>
    <a href="?page=home" class="header-link">
      <img src="./assets/media/writerjoshua.jpg" alt="WriterJoshua" class="profile-pic">
    </a>
    <div class="header-text">
      <h1>WriterJoshua</h1>
      <p>Author, Researcher, Artist</p>
    </div>
  </header>

  <!-- STATIC NAVIGATION -->
  <nav>
    <a href="?page=home" class="nav-link">Home</a>
    <a href="?page=about-josh" class="nav-link">About Josh</a>
    <a href="?page=jots" class="nav-link">Jots</a>
    <a href="?page=archive" class="nav-link">Blog</a>
    <a href="?page=projects" class="nav-link">Projects</a>
    <a href="?page=contact" class="nav-link">Contact</a>
  </nav>

  <!-- DYNAMIC CONTENT AREA -->
  <main id="content"></main>

  <!-- STATIC FOOTER -->
  <footer>
    <img src="./assets/media/writerjoshua-banner.jpg" alt="WriterJoshua Banner" class="footer-banner" onerror="this.style.display='none';">
    <div class="footer-controls">
      <button class="share-btn" onclick="shareCurrentPage()">Share</button>
    </div>
    <p class="footer-copyright">&copy; 2026 Joshua Lucero</p>
  </footer>

<script>
  // ===== MARKDOWN-IT INITIALIZATION =====
  const md = window.markdownit ? window.markdownit() : null;

  // ===== UTILITIES =====
  function getPageParam() {
    const params = new URLSearchParams(window.location.search);
    return params.get('page') || 'home';
  }

  function highlightActiveNav() {
    const currentPage = getPageParam();
    document.querySelectorAll('.nav-link').forEach(link => {
      const page = new URLSearchParams(link.search).get('page');
      if (page === currentPage) {
        link.classList.add('active');
      } else {
        link.classList.remove('active');
      }
    });
  }

  function showError(message = 'Unable to load content. Please try again.') {
    document.getElementById('content').innerHTML = `<div class="error"><p>${escapeHtml(message)}</p></div>`;
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // ===== MARKDOWN LOADER =====
  function loadMarkdown(page) {
    if (!md) {
      showError('Markdown processor unavailable. Please refresh the page.');
      return;
    }

    const paths = [
      `./assets/pages/${page}.md`,
      `./${page}.md`
    ];

    function tryPaths(pathIndex) {
      if (pathIndex >= paths.length) {
        showError(`Page not found: ${page}`);
        return;
      }

      fetch(paths[pathIndex])
        .then(response => {
          if (!response.ok) throw new Error('Not found');
          return response.text();
        })
        .then(markdown => {
          document.getElementById('content').innerHTML = md.render(markdown);
          highlightActiveNav();
        })
        .catch(() => {
          tryPaths(pathIndex + 1);
        });
    }

    tryPaths(0);
  }

  // ===== JSON LOADERS =====
  function loadProjects() {
    fetch('./assets/pages/projects.json')
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      })
      .then(data => renderProjects(data))
      .catch(err => {
        console.error('Projects load failed:', err);
        showError('Error loading projects.');
      });
  }

  function renderProjects(data) {
    let html = '<h1>Projects</h1>';

    if (data.intro) {
      html += `<p>${escapeHtml(data.intro)}</p>`;
    }
    if (data.introImage) {
      html += `<img src="${escapeHtml(data.introImage)}" alt="Projects intro" class="projects-image">`;
    }

    html += '<div class="projects-grid">';
    (data.projects || []).forEach(project => {
      html += `
        <div class="project-card">
          <a href="?page=${encodeURIComponent(project.slug)}">
            <img src="${escapeHtml(project.image)}" alt="${escapeHtml(project.title)}" class="project-image">
            <h2>${escapeHtml(project.title)}</h2>
          </a>
          <div class="project-excerpt">${escapeHtml(project.excerpt)}</div>
        </div>
      `;
    });
    html += '</div>';

    if (data.outro) {
      html += `<p>${escapeHtml(data.outro)}</p>`;
    }
    if (data.outroImage) {
      html += `<img src="${escapeHtml(data.outroImage)}" alt="Projects outro" class="projects-image">`;
    }

    document.getElementById('content').innerHTML = html;
    highlightActiveNav();
  }

  function loadJots() {
    fetch('./assets/pages/jots.json')
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      })
      .then(jots => renderJots(jots))
      .catch(err => {
        console.error('Jots load failed:', err);
        showError('Error loading jots.');
      });
  }

  function renderJots(jots) {
    const sorted = jots.sort((a, b) =>
      new Date(b.date + ' ' + b.time) - new Date(a.date + ' ' + a.time)
    );

    let html = '<h1>Jots</h1>';
    sorted.forEach(jot => {
      html += `
        <div class="jot">
          <h2>${escapeHtml(jot.title)}</h2>
          <p class="jot-meta">${escapeHtml(jot.date)} at ${escapeHtml(jot.time)}</p>
          <p>${escapeHtml(jot.content)}</p>
          ${jot.image ? `<img src="${escapeHtml(jot.image)}" alt="${escapeHtml(jot.title)}" class="jot-image">` : ''}
        </div>
      `;
    });

    document.getElementById('content').innerHTML = html;
    highlightActiveNav();
  }

  function loadArchive() {
    fetch('./assets/pages/archive.json')
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      })
      .then(data => renderArchive(data))
      .catch(err => {
        console.error('Archive load failed:', err);
        showError('Error loading archive.');
      });
  }

  function renderArchive(data) {
    let html = '<h1>Archive</h1>';

    if (data.intro) {
      html += `<p>${escapeHtml(data.intro)}</p>`;
    }
    if (data.introImage) {
      html += `<img src="${escapeHtml(data.introImage)}" alt="Archive intro" class="archive-image">`;
    }

    (data.years || []).forEach(yearMonth => {
      const monthName = new Date(yearMonth.year, yearMonth.month - 1).toLocaleString('default', { month: 'long' });
      html += `<h2>${monthName} ${yearMonth.year}</h2><ul>`;

      (yearMonth.posts || []).forEach(post => {
        const slug = post.slug.replace(/^\/+/, '');
        html += `
          <li>
            <a href="?page=${encodeURIComponent(slug)}">${escapeHtml(post.title)}</a> — ${escapeHtml(post.date)}
            <p class="post-excerpt">${escapeHtml(post.excerpt)}</p>
          </li>
        `;
      });

      html += '</ul>';
    });

    if (data.outro) {
      html += `<p>${escapeHtml(data.outro)}</p>`;
    }
    if (data.outroImage) {
      html += `<img src="${escapeHtml(data.outroImage)}" alt="Archive outro" class="archive-image">`;
    }

    document.getElementById('content').innerHTML = html;
    highlightActiveNav();
  }

  // ===== SHARING =====
  function shareCurrentPage() {
    const title = document.querySelector('h1')?.innerText || document.title;
    const url = window.location.href;
    const text = `${title} - WriterJoshua`;

    if (navigator.share) {
      navigator.share({ title, text, url }).catch(err => console.log('Share failed:', err));
    } else {
      alert('Share not supported on this device');
    }
  }

  // ===== ROUTE HANDLER =====
  function handleRoute() {
    const page = getPageParam();

    if (page === 'jots') {
      loadJots();
    } else if (page === 'archive') {
      loadArchive();
    } else if (page === 'projects') {
      loadProjects();
    } else {
      loadMarkdown(page);
    }

    highlightActiveNav();
    window.scrollTo(0, 0); // Scroll to top on page change
  }

  // ===== INITIALIZATION =====
  document.addEventListener('DOMContentLoaded', handleRoute);
  window.addEventListener('popstate', handleRoute);

  // Listen for hash/query changes
  window.addEventListener('hashchange', handleRoute);
</script>
</body>
</html>

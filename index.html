<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Author, Researcher, Artist">
  <title>WriterJoshua</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>📚</text></svg>">
  <link rel="stylesheet" href="./assets/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
</head>
<body>
  <!-- STATIC HEADER -->
  <header>
    <a href="?page=home" class="header-link">
      <img src="./assets/media/writerjoshua.jpg" alt="WriterJoshua" class="profile-pic">
    </a>
    <div class="header-text">
      <h1>WriterJoshua</h1>
      <p>Author, Researcher, Artist</p>
    </div>
  </header>

  <!-- STATIC NAVIGATION -->
  <nav>
    <a href="?page=home" class="nav-link">Home</a>
    <a href="?page=about-josh" class="nav-link">About Josh</a>
    <a href="?page=jots" class="nav-link">Jots</a>
    <a href="?page=archive" class="nav-link">Blog</a>
    <a href="?page=projects" class="nav-link">Projects</a>
    <a href="?page=contact" class="nav-link">Contact</a>
  </nav>

  <!-- DYNAMIC CONTENT AREA -->
  <main id="content"></main>

  <!-- STATIC FOOTER -->
  <footer>
    <img src="./assets/media/writerjoshua-banner.jpg" alt="WriterJoshua Banner" class="footer-banner" onerror="this.style.display='none';">
    <div class="footer-controls">
      <button class="share-btn" onclick="shareCurrentPage()">Share</button>
    </div>
    <p class="footer-copyright">&copy; 2026 Joshua Lucero</p>
  </footer>

<script>
  // ===== MARKDOWN-IT INITIALIZATION =====
  const md = window.markdownit ? window.markdownit() : null;

  // ===== UTILITIES =====
  function getPageParam() {
    const params = new URLSearchParams(window.location.search);
    return params.get('page') || 'home';
  }

  function highlightActiveNav() {
    const currentPage = getPageParam();
    document.querySelectorAll('.nav-link').forEach(link => {
      const page = new URLSearchParams(link.search).get('page');
      if (page === currentPage) {
        link.classList.add('active');
      } else {
        link.classList.remove('active');
      }
    });
  }

  function showError(message = 'Unable to load content. Please try again.') {
    document.getElementById('content').innerHTML = `<div class="error"><p>${escapeHtml(message)}</p></div>`;
  }

  function formatDateTime(dateStr, timeStr) {
    try {
      const [year, month, day] = dateStr.split('-');
      const [hours, minutes] = timeStr.split(':');
      
      // Create date object
      const date = new Date(year, month - 1, day, hours, minutes);
      
      // Format date as Month Day, Year
      const monthName = date.toLocaleString('default', { month: 'long' });
      const dayNum = date.getDate();
      const yearNum = date.getFullYear();
      
      // Format time as H:MM AM/PM PST
      const timeObj = new Date(2000, 0, 1, hours, minutes);
      const timeFormatted = timeObj.toLocaleString('en-US', {
        hour: 'numeric',
        minute: '2-digit',
        hour12: true,
        timeZone: 'America/Los_Angeles'
      });
      
      return `${monthName} ${dayNum}, ${yearNum} at ${timeFormatted} PST`;
    } catch (e) {
      return `${dateStr} at ${timeStr}`;
    }
  }

  function getImagePath(imagePath) {
    if (!imagePath) return '';
    // If path doesn't start with ./, add it
    if (!imagePath.startsWith('./') && !imagePath.startsWith('http')) {
      return './' + imagePath;
    }
    return imagePath;
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // ===== MARKDOWN LOADER =====
  function loadMarkdown(page) {
    if (!md) {
      showError('Markdown processor unavailable. Please refresh the page.');
      return;
    }

    // Build paths array with current year and previous years
    const currentYear = new Date().getFullYear();
    const paths = [`./assets/pages/${page}.md`, `./${page}.md`];
    
    // Add blog paths for current year and up to 10 years back
    for (let i = 0; i <= 10; i++) {
      const year = currentYear - i;
      paths.push(`./blog/${year}/${page}.md`);
    }

    function tryPaths(pathIndex) {
      if (pathIndex >= paths.length) {
        showError(`Page not found: ${page}`);
        return;
      }

      fetch(paths[pathIndex])
        .then(response => {
          if (!response.ok) throw new Error('Not found');
          return response.text();
        })
        .then(markdown => {
          document.getElementById('content').innerHTML = md.render(markdown);
          highlightActiveNav();
        })
        .catch(() => {
          tryPaths(pathIndex + 1);
        });
    }

    tryPaths(0);
  }

  // ===== LOAD ITEM FROM JSON =====
  function tryLoadFromJSON(slug) {
    // Try to find in projects first
    fetch('./assets/pages/projects.json')
      .then(r => r.json())
      .then(data => {
        const project = (data.projects || []).find(p => p.slug === slug);
        if (project) {
          renderSingleProject(project);
          return;
        }
        // If not found in projects, try archive
        return fetch('./assets/pages/archive.json');
      })
      .then(r => r.json())
      .then(data => {
        let post = null;
        (data.years || []).forEach(yearMonth => {
          const found = (yearMonth.posts || []).find(p => p.slug === slug);
          if (found) post = found;
        });
        if (post) {
          renderSingleArchivePost(post);
        } else {
          showError(`Page not found: ${slug}`);
        }
      })
      .catch(err => {
        console.error('Error finding page:', err);
        showError(`Page not found: ${slug}`);
      });
  }

  function renderSingleProject(project) {
    let html = `
      <h1>${escapeHtml(project.title)}</h1>
      <p>${escapeHtml(project.excerpt)}</p>
    `;
    
    if (project.image) {
      html += `<img src="${getImagePath(project.image)}" alt="${escapeHtml(project.title)}" class="projects-image">`;
    }
    
    if (project.content) {
      html += md.render(project.content);
    }
    
    document.getElementById('content').innerHTML = html;
    highlightActiveNav();
  }

  function renderSingleArchivePost(post) {
    let html = `
      <h1>${escapeHtml(post.title)}</h1>
      <p class="post-excerpt">${escapeHtml(post.excerpt)}</p>
    `;
    
    if (post.content) {
      html += md.render(post.content);
    }
    
    document.getElementById('content').innerHTML = html;
    highlightActiveNav();
  }

  // ===== JSON LOADERS =====
  // ===== GENERIC JSON LOADER & RENDERER =====
  function loadJSON(filename, itemsKey) {
    fetch(`./assets/pages/${filename}.json`)
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      })
      .then(data => renderJSON(data, itemsKey))
      .catch(err => {
        console.error(`${filename} load failed:`, err);
        showError(`Error loading ${filename}.`);
      });
  }

  function renderJSON(data, itemsKey) {
    let html = '';

    // Render intro section with markdown support
    if (data.intro) {
      html += md.render(data.intro);
    }
    if (data.introImage) {
      html += `<img src="${getImagePath(data.introImage)}" alt="Intro" class="projects-image">`;
    }

    // Render items based on type
    if (itemsKey === 'projects') {
      html = '<h1>Projects</h1>' + html;
      html += '<div class="projects-grid">';
      
      // Sort projects by order if available, otherwise keep as-is
      const projects = (data.projects || []).sort((a, b) => {
        if (a.order !== undefined && b.order !== undefined) {
          return a.order - b.order;
        }
        return 0;
      });
      
      projects.forEach(project => {
        html += `
          <div class="project-card">
            <a href="?page=${encodeURIComponent(project.slug)}">
              <img src="${getImagePath(project.image)}" alt="${escapeHtml(project.title)}" class="project-image">
              <h2>${escapeHtml(project.title)}</h2>
            </a>
            <div class="project-excerpt">${escapeHtml(project.excerpt)}</div>
          </div>
        `;
      });
      html += '</div>';
    } else if (itemsKey === 'jots') {
      html = '<h1>Jots</h1>' + html;
      
      // Sort jots by date (newest to oldest)
      const sorted = (data.jots || []).sort((a, b) =>
        new Date(b.date + ' ' + b.time) - new Date(a.date + ' ' + a.time)
      );
      
      sorted.forEach(jot => {
        const formattedDateTime = formatDateTime(jot.date, jot.time);
        html += `
          <div class="jot">
            <h2>${escapeHtml(jot.title)}</h2>
            <p class="jot-meta">${formattedDateTime}</p>
            <p>${escapeHtml(jot.content)}</p>
            ${jot.image ? `<img src="${getImagePath(jot.image)}" alt="${escapeHtml(jot.title)}" class="jot-image">` : ''}
          </div>
        `;
      });
    } else if (itemsKey === 'archive') {
      html = '<h1>Archive</h1>' + html;
      
      // Sort years from newest to oldest
      const sortedYears = (data.years || []).sort((a, b) => {
        if (a.year !== b.year) return b.year - a.year;
        return b.month - a.month;
      });
      
      sortedYears.forEach(yearMonth => {
        const monthName = new Date(yearMonth.year, yearMonth.month - 1).toLocaleString('default', { month: 'long' });
        html += `<h2>${monthName} ${yearMonth.year}</h2><ul>`;
        
        // Sort posts within each month by date (newest to oldest)
        const sortedPosts = (yearMonth.posts || []).sort((a, b) =>
          new Date(b.date) - new Date(a.date)
        );
        
        sortedPosts.forEach(post => {
          const slug = post.slug.replace(/^\/+/, '');
          html += `
            <li>
              <a href="?page=${encodeURIComponent(slug)}">${escapeHtml(post.title)}</a> — ${escapeHtml(post.date)}
              <p class="post-excerpt">${escapeHtml(post.excerpt)}</p>
            </li>
          `;
        });

        html += '</ul>';
      });
    }

    // Render outro section with markdown support
    if (data.outro) {
      html += md.render(data.outro);
    }
    if (data.outroImage) {
      html += `<img src="${getImagePath(data.outroImage)}" alt="Outro" class="projects-image">`;
    }

    document.getElementById('content').innerHTML = html;
    highlightActiveNav();
  }

  // ===== SHARING =====
  function shareCurrentPage() {
    const title = document.querySelector('h1')?.innerText || document.title;
    const url = window.location.href;
    const text = `${title} - WriterJoshua`;

    if (navigator.share) {
      navigator.share({ title, text, url }).catch(err => console.log('Share failed:', err));
    } else {
      alert('Share not supported on this device');
    }
  }

  // ===== ROUTE HANDLER =====
  function handleRoute() {
    const page = getPageParam();

    if (page === 'jots') {
      loadJSON('jots', 'jots');
    } else if (page === 'archive') {
      loadJSON('archive', 'archive');
    } else if (page === 'projects') {
      loadJSON('projects', 'projects');
    } else {
      loadMarkdown(page);
    }

    highlightActiveNav();
    window.scrollTo(0, 0);
  }

  // ===== INITIALIZATION =====
  document.addEventListener('DOMContentLoaded', handleRoute);
  window.addEventListener('popstate', handleRoute);

  // Listen for hash/query changes
  window.addEventListener('hashchange', handleRoute);
</script>
</body>
</html>
